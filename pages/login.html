<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Algebra University College</title>
    <!-- TODO: Link to main stylesheet -->
    <link rel="stylesheet" href="../css/style.css" />
    <!-- TODO: Link to authentication JavaScript file -->
    <script src="../js/auth.js"></script>
    <!-- TODO: Link to common JavaScript file -->
    <script src="../js/common.js"></script>
  </head>
  <body class="landing-page">
    <!-- Background Video (LO4) -->
    <video autoplay muted loop id="bg-video">
      <source src="../video/typingOnlaptop.mp4" type="video/mp4" />
      <!-- Fallback message for older browsers that don't support HTML5 video -->
      Your browser does not support the video tag.
    </video>
    <div class="video-overlay"></div>

    <!-- TODO: Add navigation header -->
    <nav id="navbar">
      <button id="nav_toggle" aria-expanded="false">☰</button>
      <ul id="navbar-list">
        <li>
          <a href="../index.html">Home</a>
        </li>
        <li>
          <a href="about.html">About</a>
        </li>
        <li>
          <a href="news.html">News</a>
        </li>
        <li>
          <a href="curriculum.html">Curriculum</a>
        </li>
        <li>
          <a href="contact.html">Contact</a>
        </li>
        <li><a id="nav_login" href="login.html">Login</a></li>
        <li><a id="nav_logout" href="#" style="display: none">Logout</a></li>
      </ul>
    </nav>
    <!-- TODO: Add login form with username and password fields -->
    <main id="login_main" class="glass-panel">
      <header id="main_header" class="page-header">
        <h1 class="page-title">Login</h1>
      </header>

      <form
        action="https://www.fulek.com/data/api/user/login"
        method="post"
        id="login_form"
        class="login-form"
      >
        <div class="form-group">
          <label for="username" class="form-label">Username:</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            required
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password:</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            required
          />
        </div>

        <div class="form-group">
          <button type="submit" class="submit-button">Login</button>
        </div>
      </form>
      <p>Don't have an account? <a href="/pages/register.html">Register</a></p>
      <!-- TODO: Add error message display area -->
      <div id="login_message" class="message"></div>
    </main>
    <footer id="main_footer" class="page-footer">
      <p class="footer-text">&copy; Algebra University College</p>
    </footer>
  </body>
</html>
