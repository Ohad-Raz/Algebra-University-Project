    <!-- TODO: Add contact form with name, email, message fields -->

    <main id="contact_main">
      <header id="main_header" class="page-header">
        <h1 class="page-title">Contact</h1>
      </header>
      <form
        action="https://www.fulek.com/mvc/supit/project-contact-form"
        method="post"
        id="contact_form"
        class="contact-form"
      >
        <div class="form-group">
          <label for="fullName" class="form-label">FullName:</label>
          <input type="text" id="fullName" name="fullName" class="form-input" />
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email:</label>
          <input type="email" id="email" name="email" class="form-input" />
        </div>

        <div class="form-group">
          <label for="ReceiveNewsletter" class="form-label checkbox-label">
            <input
              type="checkbox"
              id="receiveNewsletter"
              name="receiveNewsletter"
              class="form-checkbox"
            />
            receiveNewsletter:
          </label>
        </div>

        <div class="form-group">
          <label for="message" class="form-label">Message:</label>
          <textarea
            id="message"
            name="message"
            class="form-textarea"
          ></textarea>
        </div>

        <div class="form-group">
          <button type="submit" class="submit-button">Submit Form</button>
        </div>
      </form>
    </main>
