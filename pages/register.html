<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Algebra University College</title>
    <!-- TODO: Link to main stylesheet -->
    <link rel="stylesheet" href="../css/style.css" />
    <!-- TODO: Link to authentication JavaScript file -->
    <script src="../js/auth.js"></script>
    <!-- TODO: Link to common JavaScript file -->
    <script src="../js/common.js"></script>
  </head>
  <body>
    <!-- TODO: Add navigation header -->
    <nav id="navbar">
      <ul id="navbar-list">
        <li>
          <a href="/index.html">Home</a>
        </li>
        <li>
          <a href="/pages/about.html">About</a>
        </li>
        <li>
          <a href="/pages/news.html">News</a>
        </li>
        <li>
          <a href="/pages/curriculum.html">Curriculum</a>
        </li>
        <li>
          <a href="/pages/contact.html">Contact</a>
        </li>
        <li>
          <a href="/pages/login.html">Login</a>
        </li>
        <li>
          <a href="/pages/register.html" id="logout">logout</a>
        </li>
      </ul>
    </nav>
    <!-- TODO: Add login form with username and password fields -->
    <main id="register_main">
      <header id="main_header" class="page-header">
        <h1 class="page-title">Register</h1>
      </header>

      <form
        action="https://www.fulek.com/data/api/user/register"
        method="post"
        id="register_form"
        class="register-form"
      >
        <div class="form-group">
          <label for="username" class="form-label">Username:</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            required
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password:</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            required
          />
        </div>

        <div class="form-group">
          <button type="submit" class="submit-button">Register</button>
        </div>
      </form>
      <p>Already have an account? <a href="/pages/login.html">Login</a></p>
      <!-- TODO: Add error message display area -->
      <div id="register_message" class="message"></div>
    </main>
    <footer id="main_footer" class="page-footer">
      <p class="footer-text">&copy; Algebra University College</p>
    </footer>
  </body>
</html>
